name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches the package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in sdk angular elements; do
            v=$(node -p "require('./packages/$p/package.json').version")
            [ "$v" = "$tag" ] || { echo "packages/$p is $v, tag is $tag"; exit 1; }
          done
      - run: npm run typecheck && npm test && npm run build
      # Staged publishing: CI only uploads the release; a maintainer approves it with 2FA on npmjs.com
      # (or `npm stage list` + `npm stage approve <id>`) before anyone can install it. Works with a
      # "Read and write (stage only)" token in NPM_TOKEN, or with trusted publishing (OIDC, no token) once
      # each package has it configured. npm stage doesn't know workspaces, so it runs in each folder.
      - run: npm install -g npm@^11.15.0
      - name: Stage sdk, angular, elements (sdk first, the other two depend on it)
        run: |
          for p in sdk angular elements; do
            (cd "packages/$p" && npm stage publish)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
