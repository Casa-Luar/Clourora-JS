name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches the package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in sdk angular elements; do
            v=$(node -p "require('./packages/$p/package.json').version")
            [ "$v" = "$tag" ] || { echo "packages/$p is $v, tag is $tag"; exit 1; }
          done
      - run: npm run typecheck && npm test && npm run build
      # sdk first: the other two depend on it
      - run: npm publish --workspace packages/sdk --workspace packages/angular --workspace packages/elements
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
